<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de bloco do SPI Master</title>
  <desc id="desc">Mestre SPI de 8 bits em modo 3, com FSM Moore em dois processos e registradores de transmissão e recepção.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#284b63"/></marker>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#172b3a}.title{font-size:28px;font-weight:700}.label{font-size:17px;font-weight:600}.small{font-size:14px}.box{fill:#f3f7fa;stroke:#284b63;stroke-width:2}.core{fill:#e6f1f8;stroke:#1d5d83;stroke-width:3}.wire{stroke:#284b63;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1120" height="650" fill="#ffffff"/>
  <text x="560" y="48" text-anchor="middle" class="title">SPI Master · modo 3 · Moore · 8 bits</text>
  <rect x="330" y="90" width="470" height="480" rx="18" class="core"/>
  <text x="565" y="125" text-anchor="middle" class="label">SPI_MASTER</text>

  <rect x="375" y="150" width="380" height="135" rx="12" class="box"/>
  <text x="565" y="181" text-anchor="middle" class="label">p_output_logic · combinacional</text>
  <text x="565" y="211" text-anchor="middle" class="small">Decode Moore de SCLK, CS_n e busy usando state</text>
  <text x="565" y="242" text-anchor="middle" class="small">IDLE · PREPARE · SCLK_FALL · SCLK_RISE</text>

  <rect x="375" y="315" width="380" height="150" rx="12" class="box"/>
  <text x="565" y="347" text-anchor="middle" class="label">p_state_register · sequencial</text>
  <text x="565" y="378" text-anchor="middle" class="small">state + bit_count + registradores TX/RX</text>
  <text x="565" y="409" text-anchor="middle" class="small">Captura MISO na subida; desloca TX entre bits</text>
  <path d="M565 285 V315" class="wire"/>
  <path d="M755 382 H780 V245 H755" class="wire"/>
  <text x="789" y="322" transform="rotate(-90 789 322)" text-anchor="middle" class="small">state</text>

  <text x="55" y="177" class="label">Entradas</text>
  <text x="55" y="215" class="small">clk · reset_n · start_tx</text>
  <text x="55" y="242" class="small">data_in[7:0]</text>
  <path d="M235 222 H330" class="wire"/>
  <text x="55" y="417" class="label">MISO</text>
  <text x="55" y="445" class="small">bit serial do escravo</text>
  <path d="M235 430 H330" class="wire"/>

  <text x="855" y="177" class="label">Saídas de controle</text>
  <text x="855" y="215" class="small">sclk · cs_n · busy</text>
  <path d="M800 222 H835" class="wire"/>
  <text x="855" y="327" class="label">Saídas de dados</text>
  <text x="855" y="365" class="small">mosi ← tx_shift[7]</text>
  <text x="855" y="392" class="small">data_out[7:0] ← rx_shift</text>
  <path d="M755 390 H825 V375 H835" class="wire"/>

  <text x="560" y="610" text-anchor="middle" class="small">Modo 3: SCLK repousa alto; MOSI muda na descida e MISO é amostrado na subida.</text>
</svg>
