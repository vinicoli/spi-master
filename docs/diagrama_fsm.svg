<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">FSM do SPI Master</title>
  <desc id="desc">Máquina de estados com IDLE e TRANSFER, incluindo início, contagem de dezesseis bordas e conclusão.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#284b63"/></marker>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#172b3a}.title{font-size:28px;font-weight:700}.state{fill:#e6f1f8;stroke:#1d5d83;stroke-width:3}.small{font-size:15px}.label{font-size:19px;font-weight:700}.arrow{stroke:#284b63;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1100" height="560" fill="#fff"/>
  <text x="550" y="48" text-anchor="middle" class="title">Máquina de estados SPI Master</text>
  <ellipse cx="155" cy="278" rx="54" ry="35" fill="#fff" stroke="#284b63" stroke-width="2"/>
  <text x="155" y="284" text-anchor="middle" class="small">reset_n=0</text>
  <path d="M210 278 H338" class="arrow"/>
  <text x="270" y="260" text-anchor="middle" class="small">reset liberado</text>
  <rect x="350" y="205" width="250" height="145" rx="22" class="state"/>
  <text x="475" y="245" text-anchor="middle" class="label">IDLE</text>
  <text x="475" y="276" text-anchor="middle" class="small">SCLK=1, CS_n=1</text>
  <text x="475" y="301" text-anchor="middle" class="small">busy=0</text>
  <text x="475" y="326" text-anchor="middle" class="small">Aguarda start_tx</text>
  <rect x="760" y="205" width="285" height="145" rx="22" class="state"/>
  <text x="902" y="245" text-anchor="middle" class="label">TRANSFER</text>
  <text x="902" y="276" text-anchor="middle" class="small">16 transições de SCLK</text>
  <text x="902" y="301" text-anchor="middle" class="small">Descida: avança MOSI</text>
  <text x="902" y="326" text-anchor="middle" class="small">Subida: amostra MISO</text>
  <path d="M600 240 C655 160 705 160 760 240" class="arrow"/>
  <text x="680" y="157" text-anchor="middle" class="small">start_tx=1 / captura data_in,</text>
  <text x="680" y="178" text-anchor="middle" class="small">CS_n=0, busy=1</text>
  <path d="M760 320 C700 420 650 420 600 320" class="arrow"/>
  <text x="680" y="438" text-anchor="middle" class="small">oitava amostra / publica data_out,</text>
  <text x="680" y="459" text-anchor="middle" class="small">CS_n=1, busy=0</text>
  <path d="M902 350 V495 H475 V350" class="arrow"/>
  <text x="690" y="523" text-anchor="middle" class="small">start_tx durante TRANSFER é ignorado; não há fila.</text>
</svg>
